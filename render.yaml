services:
  - type: web
    name: aureum-app
    runtime: node
    plan: free
    buildCommand: npm run postinstall && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        value: "file:./prisma/dev.db"
      - key: JWT_SECRET
        generateValue: true
